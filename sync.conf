# cactsync manifest — see ../.cactsync/README.md
#
# The upstream tree is this repository itself: Wayland's sources sit at the root
# and the Cact additions are commits on the `cact` branch, stacked on the pinned
# upstream tag.  This port removed upstream's meson.build / meson_options.txt (it
# owns its build) — a sync onto a newer tag conflicts on those two paths; keep
# CactOS's files.

CACT_SYNC_NAME="CactWayland-x86_64"
CACT_SYNC_TREE="."

# `upstream` is gitlab.freedesktop.org/wayland/wayland; `origin` is reserved for
# the published CactOS repo (QwaYer/CactWayland-x86_64) so a push cannot reach
# upstream.
CACT_SYNC_REMOTE="upstream"
CACT_SYNC_URL="https://gitlab.freedesktop.org/wayland/wayland.git"

CACT_SYNC_TAG_GLOB="1.*"
CACT_SYNC_TAG_EXCLUDE="-rc|alpha|beta"

CACT_SYNC_REF="1.26.0"

CACT_SYNC_MODE="rebase"

CACT_SYNC_UNSHALLOW=1

CACT_SYNC_VERIFY="ninja -C build-meson"

CACT_SYNC_NOTES="Wayland libraries only (protocol, no compositor); protocol generated by the host wayland-scanner"
